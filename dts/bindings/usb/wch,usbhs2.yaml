description: |
  WCH second generation USB 2.0 high speed device controller (USBHS1 and
  USBHS2 on the CH32V4x7). Its UTMI PHY runs from the USBHS PLL, which is
  fed by HSE.

compatible: "wch,usbhs2"

include: usb-ep.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
